global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Scrape the market-maker process on the host (default metrics port 8000).
# Requires: runtime running on the same machine as Docker, with MM_METRICS_PORT
# set (see configure_observability). Prometheus has extra_hosts host.docker.internal
# for Linux. If UP=0, open http://localhost:9090/targets and fix reachability.
scrape_configs:
  - job_name: market_maker
    metrics_path: /metrics
    static_configs:
      - targets:
          # Your app runs on the host; enable metrics with MM_METRICS_PORT=8000.
          - host.docker.internal:8000
