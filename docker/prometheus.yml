global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape decomposed market-maker services on the host (default metrics ports).
# Requires: processes running on the same machine as Docker with MM_METRICS_PORT set.
# Prometheus uses extra_hosts host.docker.internal for Linux reachability.
scrape_configs:
  - job_name: market_maker_admin
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: admin

  - job_name: market_maker_consumer
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: consumer

  - job_name: market_maker_ingestor
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8001
        labels:
          service: ingestor

  - job_name: market_maker_persistence
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8002
        labels:
          service: persistence

  - job_name: market_maker_worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8003
        labels:
          service: worker
