# Full stack: `docker compose up` (or add `-d`) from the repo root.
# Prometheus and Mimir configs: docker/prometheus.yml, docker/mimir.yaml
# (separate files — those daemons are configured by file, not by embedding in Compose).
# Redis + diagnostics UI only (no Postgres / Prometheus / Grafana / Mimir):
#   docker compose up -d redis mm_viz
#   open http://localhost:8501
#
services:
  redis:
    image: redis:latest
    container_name: redis
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  db:
    image: postgres
    container_name: postgres
    restart: "no"
    shm_size: 128mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: meysam
      POSTGRES_PASSWORD: Welcome123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: "no"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: "no"
    command:
      - -config.file=/etc/mimir/mimir.yaml
    ports:
      - "9009:9009"
    volumes:
      - ./docker/mimir.yaml:/etc/mimir/mimir.yaml
      - mimir_data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      GF_LOG_LEVEL: warn
      # Quiet offline / restricted-network installs (no grafana.com calls for updates/plugins news).
      GF_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - mimir
      - redis

  # After changing mm_viz, rebuild: `docker compose build mm_viz --no-cache` then `docker compose up -d mm_viz`
  # (Plain `up` reuses the cached image.)
  mm_viz:
    build:
      context: .
      dockerfile: mm_viz/Dockerfile
    image: market_maker-mm_viz
    container_name: mm_viz
    restart: "no"
    environment:
      MM_DIAGNOSTICS_REDIS_URL: redis://redis:6379/0
      MM_DIAGNOSTICS_CHANNEL: mm.diagnostics.v1
      MM_DIAGNOSTICS_REDIS_LATEST_KEY: mm_diagnostics:latest
      MM_VIZ_MAX_FRAMES: "2000"
    ports:
      - "8501:8501"
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/config', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  redis-data:
  postgres_data:
  prometheus_data:
  mimir_data:
  grafana_data:
