# Full stack: `docker compose up` (or add `-d`) from the repo root.
# Prometheus config: docker/prometheus.yml
# (separate files — those daemons are configured by file, not by embedding in Compose).
# Parquet: there is no Parquet container. The Python runtime writes files under
# MM_PARQUET_ROOT (see mm/persistence/parquet_writer.py). Run the engine on the
# host with e.g. MM_PARQUET_ROOT=./data/parquet, or bind-mount parquet_data (below)
# into your own engine image. For S3-style lakes, add MinIO or another object store
# separately and point writers/readers at that API — not required for local dev.
#
# Postgres URL for mm persistence (host machine, ports published as below):
#   MM_DATABASE_URL=postgresql://meysam:Welcome123@localhost:5432/postgres
#
# Redis Streams bus (host → compose Redis):
#   MM_BUS_KIND=redis_streams  (and bus.redis_url in runtime JSON), or set
#   MM_BUS_REDIS_URL=redis://localhost:6379/0 for the admin API helper bus.
#
services:
  redis:
    image: redis:latest
    container_name: redis
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  db:
    image: postgres
    container_name: postgres
    restart: "no"
    shm_size: 128mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: meysam
      POSTGRES_PASSWORD: Welcome123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/step_economics.sql:/docker-entrypoint-initdb.d/99-step_economics.sql

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: "no"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: "no"
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki.yaml:/etc/loki/loki.yaml
      - loki_data:/loki

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: "no"
    user: "0:0"
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/tempo.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo

  # Tails repo ./logs/*.jsonl into Loki (job=market-maker-runtime). Runtime must
  # write logs under that directory — relative log_path is resolved to repo root
  # in configure_observability (see mm/observability/setup.py).
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: "no"
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data --disable-reporting
    ports:
      - "12345:12345"
    volumes:
      - ./docker/alloy.alloy:/etc/alloy/config.alloy
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./logs:/var/log/market_maker:ro
    depends_on:
      - loki
      - tempo

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: "no"
    ports:
      - "5540:5540"
    depends_on:
      - redis

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: pgadmin
  #   restart: "no"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@local.dev
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
  #     PGADMIN_CONFIG_LOGIN_BANNER: "'Market maker local pgAdmin'"
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - db

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      # For SQL/datasource debugging in container logs, temporarily set: GF_LOG_LEVEL: debug
      GF_LOG_LEVEL: warn
      # Quiet stale browser-session cookie rotation noise in local Grafana logs.
      GF_LOG_FILTERS: authn.service:error
      # Quiet offline / restricted-network installs (no grafana.com calls for updates/plugins news).
      GF_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/observability-v2:/var/lib/grafana/observability-v2
    depends_on:
      - db
      - prometheus
      - loki
      - tempo
      - redis

volumes:
  redis-data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  # pgadmin_data:
  # Optional: mount as MM_PARQUET_ROOT when running the engine in Docker, e.g.
  #   volumes:
  #     - parquet_data:/data/parquet
  #   environment:
  #     MM_PARQUET_ROOT: /data/parquet
  parquet_data:
