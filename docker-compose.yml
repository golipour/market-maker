services:
  redis:
    image: redis:latest
    container_name: redis
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  db:
    image: postgres
    container_name: postgres
    restart: "no"
    shm_size: 128mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: meysam
      POSTGRES_PASSWORD: Welcome123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: "no"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: "no"
    command:
      - -config.file=/etc/mimir/mimir.yaml
    ports:
      - "9009:9009"
    volumes:
      - ./mimir.yaml:/etc/mimir/mimir.yaml
      - mimir_data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - mimir
      - redis

  mm_viz:
    image: market_maker-mm_viz
    container_name: mm_viz
    restart: "no"
    working_dir: /app
    environment:
      MM_DIAGNOSTICS_REDIS_URL: redis://redis:6379/0
      MM_DIAGNOSTICS_CHANNEL: mm.diagnostics.v1
      MM_VIZ_MAX_FRAMES: "2000"
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      - redis

volumes:
  redis-data:
  postgres_data:
  prometheus_data:
  mimir_data:
  grafana_data:
