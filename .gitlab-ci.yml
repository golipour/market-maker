# Build one slim runtime image and push it to the GitLab Container Registry.
# All MM services (ingestor / worker / persistence / admin) use this same image
# with different `command:` overrides in Kubernetes.
#
# DinD (TLS disabled). Runner needs privileged = true for Docker-in-Docker.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   CI_REGISTRY / CI_REGISTRY_IMAGE / CI_REGISTRY_USER / CI_REGISTRY_PASSWORD
#
# Base images (seed once from a machine that can reach Docker Hub + pytorch.org):
#   bash ./scripts/seed_registry_base_images.sh
# then set:
#   BASE_NODE_IMAGE         e.g. registry.../typhon/base/node:20-bookworm-slim
#   BASE_PYTHON_IMAGE       e.g. registry.../typhon/base/python:3.11-slim-bookworm
#   BASE_PYTHON_DEPS_IMAGE  e.g. registry.../typhon/base/python-deps:3.11-slim-bookworm

stages:
  - build

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"

build:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -gt 45 ]; then
          echo "Docker daemon did not become ready (privileged=true required on the runner)."
          exit 1
        fi
        sleep 2
      done
    - |
      echo "CI_REGISTRY=${CI_REGISTRY:-<empty>}"
      echo "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE:-<empty>}"
      if [ -z "${CI_REGISTRY}" ] || [ -z "${CI_REGISTRY_IMAGE}" ]; then
        echo "ERROR: set CI_REGISTRY and CI_REGISTRY_IMAGE in CI/CD Variables."
        exit 1
      fi
      export BASE_NODE_IMAGE="${BASE_NODE_IMAGE:-${CI_REGISTRY}/typhon/base/node:20-bookworm-slim}"
      export BASE_PYTHON_IMAGE="${BASE_PYTHON_IMAGE:-${CI_REGISTRY}/typhon/base/python:3.11-slim-bookworm}"
      export BASE_PYTHON_DEPS_IMAGE="${BASE_PYTHON_DEPS_IMAGE:-${CI_REGISTRY}/typhon/base/python-deps:3.11-slim-bookworm}"
      echo "BASE_NODE_IMAGE=${BASE_NODE_IMAGE}"
      echo "BASE_PYTHON_IMAGE=${BASE_PYTHON_IMAGE}"
      echo "BASE_PYTHON_DEPS_IMAGE=${BASE_PYTHON_DEPS_IMAGE}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export IMAGE_TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_LATEST="${CI_REGISTRY_IMAGE}:latest"
    - |
      docker build \
        --platform linux/amd64 \
        --build-arg "NODE_IMAGE=${BASE_NODE_IMAGE}" \
        --build-arg "PYTHON_IMAGE=${BASE_PYTHON_IMAGE}" \
        --build-arg "PYTHON_DEPS_IMAGE=${BASE_PYTHON_DEPS_IMAGE}" \
        -t "$IMAGE_TAG" \
        -t "$IMAGE_LATEST" \
        .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
    - echo "Pushed $IMAGE_TAG"
    - echo "Pushed $IMAGE_LATEST"
  after_script:
    - docker image ls "${CI_REGISTRY_IMAGE}" || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
