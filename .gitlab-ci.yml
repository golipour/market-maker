# Build one slim runtime image and push it to the GitLab Container Registry.
# All MM services (ingestor / worker / persistence / admin) use this same image
# with different `command:` overrides in Kubernetes.
#
# Uses Kaniko (no Docker-in-Docker / privileged runner required).
# Your runner log showed DinD failing on gitlab-runner 12.5; Kaniko avoids that.
#
# Required:
#   Settings → General → Visibility → Container registry: Enabled

stages:
  - build

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"

build:
  stage: build
  # Kaniko builds from a Dockerfile and pushes directly; no docker.sock / dind.
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH="$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${CI_REGISTRY}" "${AUTH}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE_TAG}" \
        --destination "${IMAGE_LATEST}" \
        --snapshot-mode=redo \
        --use-new-run \
        --verbosity=info
    - echo "Pushed ${IMAGE_TAG}"
    - echo "Pushed ${IMAGE_LATEST}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
