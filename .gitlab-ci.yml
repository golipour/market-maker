# Build one slim runtime image and push it to the GitLab Container Registry.
# All MM services (ingestor / worker / persistence / admin) use this same image
# with different `command:` overrides in Kubernetes.
#
# DinD (TLS disabled) — your runner already has docker:24.0.5 images cached,
# but gcr.io/kaniko is blocked (403). The GitLab runner must allow privileged
# containers for Docker-in-Docker:
#   /etc/gitlab-runner/config.toml → [runners.docker] privileged = true
#
# Required project setting:
#   Settings → General → Visibility → Container registry: Enabled

stages:
  - build

variables:
  # Non-TLS DinD (avoids the tcp://docker:2375 /certs mismatch).
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"

build:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      # Older runners ignore this; DOCKER_TLS_CERTDIR="" is the important part.
      command: ["--tls=false"]
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -gt 45 ]; then
          echo "Docker daemon did not become ready."
          echo "Ask a GitLab admin to set privileged = true on runner CsRzYNKe."
          docker info || true
          exit 1
        fi
        sleep 2
      done
      docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build \
        --pull \
        -t "$IMAGE_TAG" \
        -t "$IMAGE_LATEST" \
        .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
    - echo "Pushed $IMAGE_TAG"
    - echo "Pushed $IMAGE_LATEST"
  after_script:
    - docker image ls "$CI_REGISTRY_IMAGE" || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
