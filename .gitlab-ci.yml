# Build one slim runtime image and push it to the GitLab Container Registry.
# All MM services (ingestor / worker / persistence / admin) use this same image
# with different `command:` overrides in Kubernetes.
#
# DinD (TLS disabled). Runner needs privileged = true for Docker-in-Docker.
#
# If CI_REGISTRY is empty (common on self-hosted GitLab without registry
# configured), set project CI/CD variables (Settings → CI/CD → Variables):
#   CI_REGISTRY          e.g. repo.tmhezardastan.ir:5050
#   CI_REGISTRY_IMAGE    e.g. repo.tmhezardastan.ir:5050/typhon/market-maker
#   CI_REGISTRY_USER     deploy-token username (e.g. gitlab+deploy-token-N)
#   CI_REGISTRY_PASSWORD deploy-token password
# Create the token under: Settings → Repository → Deploy tokens
#   scopes: read_registry, write_registry

stages:
  - build

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"

build:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - |
      echo "Waiting for Docker daemon..."
      i=0
      until docker info >/dev/null 2>&1; do
        i=$((i + 1))
        if [ "$i" -gt 45 ]; then
          echo "Docker daemon did not become ready (privileged=true required on the runner)."
          exit 1
        fi
        sleep 2
      done
    - |
      echo "CI_REGISTRY=${CI_REGISTRY:-<empty>}"
      echo "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE:-<empty>}"
      echo "CI_REGISTRY_USER=${CI_REGISTRY_USER:-<empty>}"
      if [ -z "${CI_REGISTRY}" ] || [ -z "${CI_REGISTRY_IMAGE}" ]; then
        echo ""
        echo "ERROR: GitLab Container Registry variables are not set."
        echo "Either enable Container Registry for this GitLab instance/project,"
        echo "or set these CI/CD variables (Settings → CI/CD → Variables):"
        echo "  CI_REGISTRY"
        echo "  CI_REGISTRY_IMAGE"
        echo "  CI_REGISTRY_USER"
        echo "  CI_REGISTRY_PASSWORD"
        echo ""
        echo "Create a Deploy Token (Settings → Repository → Deploy tokens)"
        echo "with read_registry + write_registry, then use it as USER/PASSWORD."
        exit 1
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export IMAGE_TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_LATEST="${CI_REGISTRY_IMAGE}:latest"
    - |
      docker build \
        --pull \
        -t "$IMAGE_TAG" \
        -t "$IMAGE_LATEST" \
        .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
    - echo "Pushed $IMAGE_TAG"
    - echo "Pushed $IMAGE_LATEST"
  after_script:
    - docker image ls "${CI_REGISTRY_IMAGE}" || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
