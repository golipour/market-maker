apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-maker-parquet
  namespace: market-maker
  labels:
    app.kubernetes.io/part-of: market-maker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker-ingestor
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-ingestor
    app.kubernetes.io/component: ingestor
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-maker-ingestor
      app.kubernetes.io/component: ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-maker-ingestor
        app.kubernetes.io/component: ingestor
        app.kubernetes.io/part-of: market-maker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingestor
          image: market-maker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - mm.ingestor
            - --config
            - /config/ingestor.json
          ports:
            - containerPort: 8001
              name: metrics
          env:
            - name: MM_ENV
              value: prod
            - name: MM_WORKER_ID
              value: ingestor-1
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: market-maker-config
---
apiVersion: v1
kind: Service
metadata:
  name: market-maker-ingestor
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-ingestor
    app.kubernetes.io/component: ingestor
    app.kubernetes.io/part-of: market-maker
spec:
  selector:
    app.kubernetes.io/name: market-maker-ingestor
    app.kubernetes.io/component: ingestor
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
