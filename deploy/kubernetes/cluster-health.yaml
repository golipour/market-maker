apiVersion: v1
kind: ConfigMap
metadata:
  name: market-maker-cluster-health
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-cluster-health
    app.kubernetes.io/component: alerts
    app.kubernetes.io/part-of: market-maker
data:
  MM_ADMIN_URL: "http://market-maker-admin:8080"
  MM_ALERT_WEBHOOK: ""
  TICK_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker-cluster-health
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-cluster-health
    app.kubernetes.io/component: alerts
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-maker-cluster-health
      app.kubernetes.io/component: alerts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-maker-cluster-health
        app.kubernetes.io/component: alerts
        app.kubernetes.io/part-of: market-maker
    spec:
      containers:
        - name: cluster-health
          image: market-maker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - mm.observability.cluster_health
          env:
            - name: MM_ENV
              value: prod
            - name: MM_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: market-maker-cluster-health
                  key: MM_ADMIN_URL
            - name: MM_ALERT_WEBHOOK
              valueFrom:
                configMapKeyRef:
                  name: market-maker-cluster-health
                  key: MM_ALERT_WEBHOOK
            - name: TICK_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: market-maker-cluster-health
                  key: TICK_SECONDS
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: market-maker-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
