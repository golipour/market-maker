apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: market-maker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: market-maker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: market-maker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: market-maker
    spec:
      # Official postgres image starts as root and chowns PGDATA. NFS
      # root_squash rejects that chown and crash-loops. Run as uid 999
      # so the entrypoint skips chown; initContainer makes the mount
      # writable so postgres can create the pgdata subdirectory itself.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      initContainers:
        - name: prepare-pgdata
          image: postgres:17
          imagePullPolicy: IfNotPresent
          # Must run as the same uid that owns PGDATA (999), not root.
          # The volume is NFS with root_squash, so uid 0 is squashed to
          # nobody and cannot traverse pgdata (mode 0700, owned by postgres).
          # That made the PG_VERSION probe below unreadable, so the guard
          # wrongly concluded the directory was uninitialised and tried to
          # `rm -rf` it, which failed with "Permission denied" and, under
          # `set -e`, crash-looped the initContainer. The database then ran
          # for a month on an older revision while this one never started.
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              dest=/var/lib/postgresql/data
              pgdata="$dest/pgdata"
              chmod 0777 "$dest" 2>/dev/null || true

              # Already initialised: never touch it. This is the only branch
              # a healthy database ever reaches.
              if [ -f "$pgdata/PG_VERSION" ]; then
                echo "prepare-pgdata: existing cluster at $pgdata, leaving it untouched"
                exit 0
              fi

              # Absent: create it so the postgres entrypoint can initialise.
              if [ ! -e "$pgdata" ]; then
                mkdir -p "$pgdata"
                echo "prepare-pgdata: created empty $pgdata"
                exit 0
              fi

              # Exists but has no readable PG_VERSION. This is ambiguous: it
              # may be a partial init, or it may be a real cluster we simply
              # cannot read. Deleting here risks destroying the database, so
              # fail loudly and let a human decide instead.
              echo "prepare-pgdata: ERROR $pgdata exists but PG_VERSION is absent or unreadable" >&2
              echo "prepare-pgdata: refusing to delete automatically; inspect the volume before proceeding" >&2
              exit 1
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: mm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: market-maker-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mm", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: market-maker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: market-maker
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
