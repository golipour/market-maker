apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: market-maker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: market-maker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: market-maker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: market-maker
    spec:
      # Official postgres image starts as root and chowns PGDATA. NFS
      # root_squash rejects that chown and crash-loops. Run as uid 999
      # so the entrypoint skips chown; initContainer makes the mount
      # writable so postgres can create the pgdata subdirectory itself.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      initContainers:
        - name: prepare-pgdata
          image: postgres:17
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              dest=/var/lib/postgresql/data
              chmod 0777 "$dest" || true
              if [ ! -f "$dest/pgdata/PG_VERSION" ]; then
                rm -rf "$dest/pgdata"
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: mm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: market-maker-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mm", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: market-maker
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: market-maker
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
