# Example only — do not commit real credentials.
#
# App secrets:
#   kubectl -n market-maker create secret generic market-maker-secrets \
#     --from-literal=MM_DATABASE_URL='postgresql://user:pass@postgres:5432/postgres' \
#     --from-literal=MM_ADMIN_TOKEN='replace-me' \
#     --from-literal=NOBITEX_API_TOKEN='replace-me'
#
# GitLab registry pull secret (needed for private images):
#   kubectl -n market-maker create secret docker-registry gitlab-registry \
#     --docker-server="$CI_REGISTRY" \
#     --docker-username='gitlab-deploy-token-or-username' \
#     --docker-password='token-or-password'
apiVersion: v1
kind: Secret
metadata:
  name: market-maker-secrets
  namespace: market-maker
  labels:
    app.kubernetes.io/part-of: market-maker
type: Opaque
stringData:
  MM_DATABASE_URL: postgresql://user:password@postgres:5432/postgres
  MM_ADMIN_TOKEN: replace-me
  NOBITEX_API_TOKEN: replace-me
