apiVersion: v1
kind: ConfigMap
metadata:
  name: market-maker-config
  namespace: market-maker
  labels:
    app.kubernetes.io/part-of: market-maker
data:
  ingestor.json: |
    {
      "load_feeds_from_registry": true,
      "feeds": [],
      "exchanges": {
        "nobitex": {
          "market_data": {
            "mode": "rest",
            "depth_limit": 100,
            "trades_limit": 200,
            "poll_interval_ms": 2000
          }
        },
        "bitwana": {
          "market_data": {
            "mode": "rest",
            "depth_limit": 200,
            "trades_limit": 200,
            "poll_interval_ms": 2000
          }
        }
      },
      "bus": {
        "kind": "redis_streams",
        "redis_url": "redis://redis:6379/0",
        "stream_prefix": "mm",
        "consumer_group": "mm-ingestor",
        "consumer_name": "ingestor-1",
        "max_stream_length": 5000,
        "read_block_ms": 1000
      },
      "observability": {
        "service_name": "market-maker-ingestor",
        "metrics_enabled": true,
        "metrics_port": 8001,
        "json_logs": true,
        "log_path": null
      },
      "scheduler": {
        "max_concurrency": 8
      }
    }
  persistence.json: |
    {
      "load_feeds_from_registry": true,
      "feeds": [],
      "exchanges": ["nobitex", "bitwana"],
      "actors": ["mpc-controller"],
      "bus": {
        "kind": "redis_streams",
        "redis_url": "redis://redis:6379/0",
        "stream_prefix": "mm",
        "consumer_group": "persistence",
        "consumer_name": "persistence-1",
        "max_stream_length": 5000,
        "read_block_ms": 1000
      },
      "persistence": {
        "enabled": true,
        "database_url_env": "MM_DATABASE_URL",
        "batch_size": 100,
        "flush_interval_ms": 1000
      },
      "observability": {
        "service_name": "market-maker-persistence",
        "metrics_enabled": true,
        "metrics_port": 8002,
        "json_logs": true,
        "log_path": null
      }
    }
  worker.json: |
    {
      "worker_id": "worker-1",
      "mode": "multi",
      "registry": {
        "database_url_env": "MM_DATABASE_URL"
      },
      "bus": {
        "kind": "redis_streams",
        "redis_url": "redis://redis:6379/0",
        "stream_prefix": "mm",
        "consumer_group": "mm-worker",
        "consumer_name": "worker-1",
        "max_stream_length": 5000,
        "read_block_ms": 1000
      },
      "backoff": {
        "initial_s": 1.0,
        "max_s": 60.0
      },
      "heartbeat_interval_s": 30,
      "lease_ttl_seconds": 300,
      "observability": {
        "service_name": "market-maker-worker",
        "metrics_enabled": true,
        "metrics_port": 8003,
        "json_logs": true,
        "log_path": null
      }
    }
