apiVersion: batch/v1
kind: Job
metadata:
  name: market-maker-seed-registry
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-seed-registry
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: market-maker
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-maker-seed-registry
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: market-maker
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: seed
          image: market-maker:latest
          imagePullPolicy: Always
          env:
            - name: MM_BUS_REDIS_URL
              value: redis://redis:6379/0
          envFrom:
            - secretRef:
                name: market-maker-secrets
          command:
            - python3
            - -c
            - |
              import os
              from mm.tools.seed_local_registry import ensure_local_worker_registry
              from mm.registry.store import build_registry_store
              seeded = ensure_local_worker_registry()
              redis_url = os.environ.get("MM_BUS_REDIS_URL", "redis://redis:6379/0").strip()
              store = build_registry_store()
              platform = store.get_platform_settings()
              bus = dict(platform.bus)
              bus["redis_url"] = redis_url
              store.upsert_platform_settings(bus=bus)
              print(f"seeded={seeded} redis_url={redis_url}")
