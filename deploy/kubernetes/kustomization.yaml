apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: market-maker
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - postgres.yaml
  - ingestor.yaml
  - persistence.yaml
  - worker.yaml
  - admin.yaml
  - seed-registry-job.yaml
  - retention-cronjob.yaml
# GitLab Container Registry path (must match $CI_REGISTRY_IMAGE).
images:
  - name: market-maker
    newName: registry.tmhezardastan.ir/typhon/market-maker
    newTag: latest
patches:
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=market-maker,app.kubernetes.io/name!=redis,app.kubernetes.io/name!=postgres"
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=market-maker,app.kubernetes.io/name!=redis,app.kubernetes.io/name!=postgres"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
