apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker-worker
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-maker-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-maker-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: market-maker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: market-maker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - mm.worker
            - --config
            - /config/worker.json
          ports:
            - containerPort: 8003
              name: metrics
          env:
            - name: MM_ENV
              value: prod
            - name: MM_WORKER_ID
              value: worker-1
            - name: MM_METRICS_LABEL_WORKER_ID
              value: "1"
            # Read once at startup only when Postgres has no attribution rows yet.
            # The order path no longer rewrites this file.
            - name: MM_ORDER_ATTRIBUTION_CACHE_DIR
              value: /data/attribution
            # Bitwana is served in-cluster by panther-app; bit.yshm.ir is only an
            # ingress in front of it. Going direct skips that hop (~5.8x faster on
            # the orderbook path) and avoids the ingress 504s. Plain HTTP, so this
            # couples market-maker to the panther namespace staying reachable.
            - name: BITWANA_API_BASE_URL
              value: "http://panther-app.panther.svc.cluster.local"
            # PyTorch Inductor writes generated C++/objects here at process
            # boot (warm_soft_fill_compile). It must be a writable path owned
            # by the runtime user; the default /tmp gets cleared on restart,
            # so every restart pays a cold compile. An emptyDir keeps warm
            # codegen for the pod lifetime, so steady-state boot is the ~1 s
            # warm-cache path rather than 3-5 s.
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /var/cache/torchinductor
            # Raised from 2 to 4 to match the node's spare capacity (8 cores,
            # this pod is the only heavy consumer). Halving decide time is NOT
            # expected: the rollout tensors are small, so per-op dispatch
            # dominates and extra cores mostly add sync overhead. Set
            # MM_PROFILE_DECIDE=1 once and read the emitted trace before
            # concluding more cores is the right lever.
            - name: TORCHINDUCTOR_COMPILE_THREADS
              value: "4"
            # torch.get_num_threads() reads the node's core count (8 on
            # node3), not this container's cpu limit, so the rollout kernel
            # oversubscribes and collapses. With multi-strategy workers
            # (e.g. concurrent local + sample controllers), setting this to 2
            # guarantees intra-op threads sum to at most 4 across active
            # runners, avoiding Linux CFS quota throttling.
            #
            # apply_torch_threads() exports this to OMP_NUM_THREADS /
            # TORCHINDUCTOR_NUM_THREADS as well, because inductor's generated
            # C++ reads OMP_NUM_THREADS at torch-import time -- before the
            # optimizer (and therefore apply_torch_threads) is ever built.
            # Without the env export, torch.set_num_threads constrained only
            # the eager path and the compiled kernel still used 8 threads.
            - name: MM_TORCH_THREADS
              value: "2"
          envFrom:
            - secretRef:
                name: market-maker-secrets
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: attribution-cache
              mountPath: /data/attribution
            - name: inductor-cache
              mountPath: /var/cache/torchinductor
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: market-maker-config
        - name: attribution-cache
          emptyDir: {}
        # PersistentVolumeClaim, not emptyDir: compiled kernels are worth
        # keeping across restarts. Serial codegen measured 129 s for a single
        # venue signature, and production runs two venues x several shape
        # variants, so a cold compile after every deploy or node reschedule
        # leaves the worker running eager for minutes. The PVC holds ~30 MB of
        # generated C++/objects; it is ReadWriteOnce, so only one worker
        # replica may mount it at a time (replicas: 1).
        - name: inductor-cache
          persistentVolumeClaim:
            claimName: market-maker-inductor-cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-maker-inductor-cache
  namespace: market-maker
  labels:
    app.kubernetes.io/part-of: market-maker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: market-maker-worker
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: market-maker
spec:
  selector:
    app.kubernetes.io/name: market-maker-worker
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 8003
      targetPort: metrics
