apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker-worker
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-maker-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-maker-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: market-maker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: market-maker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - mm.worker
            - --config
            - /config/worker.json
          ports:
            - containerPort: 8003
              name: metrics
          env:
            - name: MM_ENV
              value: prod
            - name: MM_WORKER_ID
              value: worker-1
            - name: MM_METRICS_LABEL_WORKER_ID
              value: "1"
            - name: MM_ORDER_ATTRIBUTION_CACHE_DIR
              value: /data/attribution
            # PyTorch Inductor writes generated C++/objects here at process
            # boot (warm_soft_fill_compile). It must be a writable path owned
            # by the runtime user; the default /tmp gets cleared on restart,
            # so every restart pays a cold compile. An emptyDir keeps warm
            # codegen for the pod lifetime, so steady-state boot is the ~1 s
            # warm-cache path rather than 3-5 s.
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /var/cache/torchinductor
            # Match the container's cpu limit (2). Serial codegen measured
            # 129 s for one venue signature; letting inductor use both cores
            # roughly halves that.
            - name: TORCHINDUCTOR_COMPILE_THREADS
              value: "2"
          envFrom:
            - secretRef:
                name: market-maker-secrets
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: attribution-cache
              mountPath: /data/attribution
            - name: inductor-cache
              mountPath: /var/cache/torchinductor
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: market-maker-config
        - name: attribution-cache
          emptyDir: {}
        - name: inductor-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: market-maker-worker
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: market-maker
spec:
  selector:
    app.kubernetes.io/name: market-maker-worker
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 8003
      targetPort: metrics
