# Postgres-only event writer for Grafana SQL dashboards (`mm_events`).
# No parquet / replay volume — omit this file from kustomization for live-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker-persistence
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-persistence
    app.kubernetes.io/component: persistence
    app.kubernetes.io/part-of: market-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-maker-persistence
      app.kubernetes.io/component: persistence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-maker-persistence
        app.kubernetes.io/component: persistence
        app.kubernetes.io/part-of: market-maker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: persistence
          image: market-maker:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - mm.persistence
            - --config
            - /config/persistence.json
          ports:
            - containerPort: 8002
              name: metrics
          env:
            - name: MM_ENV
              value: prod
            - name: MM_PARQUET_ROOT
              value: ""
          envFrom:
            - secretRef:
                name: market-maker-secrets
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: market-maker-config
---
apiVersion: v1
kind: Service
metadata:
  name: market-maker-persistence
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-persistence
    app.kubernetes.io/component: persistence
    app.kubernetes.io/part-of: market-maker
spec:
  selector:
    app.kubernetes.io/name: market-maker-persistence
    app.kubernetes.io/component: persistence
  ports:
    - name: metrics
      port: 8002
      targetPort: metrics
