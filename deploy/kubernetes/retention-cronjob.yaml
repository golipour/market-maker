# Daily Postgres retention. Indexes are created CONCURRENTLY on first run.
# Events 7d / facts 30d is enough for Grafana; raw orderbook JSON is the bulk of mm_events.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-maker-retention
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-retention
    app.kubernetes.io/component: persistence
    app.kubernetes.io/part-of: market-maker
spec:
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-maker-retention
            app.kubernetes.io/component: persistence
            app.kubernetes.io/part-of: market-maker
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: gitlab-registry
          containers:
            - name: retention
              image: market-maker:latest
              imagePullPolicy: Always
              command:
                - python3
                - -m
                - mm.tools.apply_retention
                - --events-days
                - "7"
                - --facts-days
                - "30"
                - --admin-audit-days
                - "365"
              env:
                - name: MM_ENV
                  value: prod
              envFrom:
                - secretRef:
                    name: market-maker-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
