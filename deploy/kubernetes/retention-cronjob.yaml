# Daily Postgres retention. Indexes are created CONCURRENTLY on first run.
#
# Retention windows are sourced from the runtime configmap (see
# market-maker-config), with a single source of truth in the JSON under
# ``persistence.retention``. The CLI flags are kept as overrides for
# emergency drills (e.g. ``--events-days 1``); if you set them, the cron
# will use those values instead of the configmap.
#
# The canary row ``mm_events.event_id = '_retention_canary'`` is refreshed
# on every successful run; cluster_health surfaces the age on /metrics and
# the admin overview so a stuck retention job is visible.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-maker-retention
  namespace: market-maker
  labels:
    app.kubernetes.io/name: market-maker-retention
    app.kubernetes.io/component: persistence
    app.kubernetes.io/part-of: market-maker
spec:
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-maker-retention
            app.kubernetes.io/component: persistence
            app.kubernetes.io/part-of: market-maker
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: gitlab-registry
          containers:
            - name: retention
              image: market-maker:latest
              imagePullPolicy: Always
              # Auto-loads /config/runtime.json when present, so retention
              # windows come from the configmap. To override on a one-off run,
              # pass --events-days / --facts-days / --admin-audit-days here.
              command:
                - python3
                - -m
                - mm.tools.apply_retention
              env:
                - name: MM_ENV
                  value: prod
                - name: MM_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: market-maker-secrets
                      key: MM_DATABASE_URL
              envFrom:
                - secretRef:
                    name: market-maker-secrets
              volumeMounts:
                - name: runtime-config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: runtime-config
              configMap:
                name: market-maker-config
